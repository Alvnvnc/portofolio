services:
  portofolio-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portofolio-web
    restart: unless-stopped
    ports:
      - "4782:4782"
    environment:
      - PORT=4782
      - HOST=0.0.0.0
      - NODE_ENV=production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4782').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  portofolio-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: portofolio-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/bede2f17-29d8-47f3-9607-fbb25e021649.json:/etc/cloudflared/bede2f17-29d8-47f3-9607-fbb25e021649.json:ro
    depends_on:
      portofolio-web:
        condition: service_healthy
